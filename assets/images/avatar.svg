<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle with glow -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" />
  <circle cx="200" cy="200" r="165" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="3" filter="url(#glow)" stroke-opacity="0.7"/>

  <!-- Code / Grid geometry in background -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1.5">
    <line x1="60" y1="200" x2="340" y2="200" stroke-dasharray="4 4" />
    <line x1="200" y1="60" x2="200" y2="340" stroke-dasharray="4 4" />
    <circle cx="200" cy="200" r="120" fill="none" stroke-dasharray="6 6" />
  </g>

  <!-- Stylized Monogram Avatar -->
  <g transform="translate(0, -10)">
    <!-- Sleek Hexagon Core -->
    <polygon points="200,90 275,135 275,225 200,270 125,225 125,135" 
             fill="url(#accentGrad)" opacity="0.15" stroke="url(#accentGrad)" stroke-width="2" />
    
    <!-- Central Initials "MA" (Mohd Aadil) in modern geometric font -->
    <text x="200" y="215" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
          font-size="78" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
      MA
    </text>
    
    <!-- Tagline underneath -->
    <text x="200" y="245" font-family="'Inter', sans-serif" 
          font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="3">
      DEV &#8226; DESIGN
    </text>
  </g>

  <!-- Floating Badges -->
  <!-- Top Left: Web Dev -->
  <g transform="translate(50, 90)">
    <rect width="90" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="45" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">&lt;Developer /&gt;</text>
  </g>

  <!-- Top Right: Creative Design -->
  <g transform="translate(260, 90)">
    <rect width="90" height="30" rx="15" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
    <text x="45" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f472b6" text-anchor="middle">&#10024; UI/UX &#8226; Art</text>
  </g>

  <!-- Bottom: Experience Badge -->
  <g transform="translate(130, 310)">
    <rect width="140" height="34" rx="17" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2" />
    <circle cx="24" cy="17" r="5" fill="#10b981" />
    <text x="82" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle">6+ YRS EXP</text>
  </g>
</svg>
