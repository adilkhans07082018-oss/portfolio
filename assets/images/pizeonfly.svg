<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pzBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadowPz" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#pzBg)"/>

  <!-- Browser Window Wrapper -->
  <g transform="translate(40, 30)" filter="url(#shadowPz)">
    <!-- Header -->
    <rect width="720" height="40" rx="8" fill="#064e3b"/>
    <rect y="32" width="720" height="8" fill="#064e3b"/>
    <circle cx="25" cy="20" r="5.5" fill="#ef4444"/>
    <circle cx="45" cy="20" r="5.5" fill="#f59e0b"/>
    <circle cx="65" cy="20" r="5.5" fill="#10b981"/>
    
    <rect x="110" y="9" width="380" height="22" rx="5" fill="#022c22"/>
    <text x="130" y="24" font-family="'Inter', sans-serif" font-size="11" fill="#6ee7b7">https://pizeonfly.com/client-showcase</text>

    <!-- Content -->
    <g transform="translate(0, 40)">
      <rect width="720" height="390" fill="#022019"/>
      
      <!-- Top Brand Bar -->
      <rect width="720" height="55" fill="#032b22"/>
      <line x1="0" y1="55" x2="720" y2="55" stroke="#064e3b" stroke-width="1"/>

      <!-- Logo -->
      <g transform="translate(40, 16)">
        <circle cx="12" cy="12" r="12" fill="#10b981"/>
        <text x="32" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#ffffff">PIZEON<tspan fill="#34d399">FLY</tspan></text>
      </g>

      <text x="360" y="32" font-family="'Inter', sans-serif" font-size="11" fill="#a7f3d0" font-weight="600">WP DEVELOPMENT</text>
      <text x="495" y="32" font-family="'Inter', sans-serif" font-size="11" fill="#6ee7b7">THEME BUILDS</text>
      <text x="600" y="32" font-family="'Inter', sans-serif" font-size="11" fill="#6ee7b7">NEWSLETTERS</text>

      <!-- Main Showcase Grid -->
      <g transform="translate(40, 75)">
        <rect width="640" height="150" rx="10" fill="#06382c" stroke="#0b5e48" stroke-width="1"/>
        
        <text x="30" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#ffffff">WordPress Theme Engine &amp; Custom CMS Architectures</text>
        <text x="30" y="65" font-family="'Inter', sans-serif" font-size="12" fill="#a7f3d0">Developed, deployed and maintained over 30+ client web portals and marketing funnels.</text>

        <!-- Tech tags -->
        <g transform="translate(30, 95)">
          <rect width="115" height="28" rx="6" fill="#022c22" stroke="#10b981" stroke-width="1"/>
          <text x="57" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">WordPress Core</text>

          <rect x="125" y="0" width="100" height="28" rx="6" fill="#022c22" stroke="#10b981" stroke-width="1"/>
          <text x="175" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">Elementor Pro</text>

          <rect x="235" y="0" width="115" height="28" rx="6" fill="#022c22" stroke="#10b981" stroke-width="1"/>
          <text x="292" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">HTML5 &#8226; CSS3</text>

          <rect x="360" y="0" width="125" height="28" rx="6" fill="#022c22" stroke="#10b981" stroke-width="1"/>
          <text x="422" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">Email Marketing</text>
        </g>
      </g>

      <!-- Lower Highlight stats -->
      <g transform="translate(40, 245)">
        <g transform="translate(0, 0)">
          <rect width="200" height="95" rx="8" fill="#042c22" stroke="#094838" stroke-width="1"/>
          <text x="20" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#34d399">2+ Years</text>
          <text x="20" y="60" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f0fdf4">Core Web Development</text>
          <text x="20" y="78" font-family="'Inter', sans-serif" font-size="10" fill="#6ee7b7">End-to-end theme deployment</text>
        </g>

        <g transform="translate(220, 0)">
          <rect width="200" height="95" rx="8" fill="#042c22" stroke="#094838" stroke-width="1"/>
          <text x="20" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#34d399">100+</text>
          <text x="20" y="60" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f0fdf4">Marketing Creatives</text>
          <text x="20" y="78" font-family="'Inter', sans-serif" font-size="10" fill="#6ee7b7">Banners, EDMs &amp; brochures</text>
        </g>

        <g transform="translate(440, 0)">
          <rect width="200" height="95" rx="8" fill="#042c22" stroke="#094838" stroke-width="1"/>
          <text x="20" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#34d399">100%</text>
          <text x="20" y="60" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f0fdf4">Client Satisfaction</text>
          <text x="20" y="78" font-family="'Inter', sans-serif" font-size="10" fill="#6ee7b7">Direct client coordination</text>
        </g>
      </g>

      <!-- Bottom Bar -->
      <rect y="365" width="720" height="25" fill="#011b15"/>
      <text x="360" y="381" font-family="'Inter', sans-serif" font-size="10" fill="#059669" text-anchor="middle">Developed at Pizeonfly (2018 – 2020) &#8226; Custom CMS, Email Marketing &amp; Graphics</text>
    </g>
  </g>
</svg>
