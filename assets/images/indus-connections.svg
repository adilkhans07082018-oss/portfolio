<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="icBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadowIc" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#icBg)"/>

  <!-- Browser Window Wrapper -->
  <g transform="translate(40, 30)" filter="url(#shadowIc)">
    <!-- Header -->
    <rect width="720" height="40" rx="8" fill="#1e293b"/>
    <rect y="32" width="720" height="8" fill="#1e293b"/>
    <circle cx="25" cy="20" r="5.5" fill="#ef4444"/>
    <circle cx="45" cy="20" r="5.5" fill="#f59e0b"/>
    <circle cx="65" cy="20" r="5.5" fill="#10b981"/>
    
    <rect x="110" y="9" width="380" height="22" rx="5" fill="#0f172a"/>
    <text x="130" y="24" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">https://indusconnections.com</text>

    <!-- Content -->
    <g transform="translate(0, 40)">
      <rect width="720" height="390" fill="#0f172a"/>
      
      <!-- Top Brand Bar -->
      <rect width="720" height="55" fill="#111827"/>
      <line x1="0" y1="55" x2="720" y2="55" stroke="#1f2937" stroke-width="1"/>

      <!-- Logo -->
      <g transform="translate(40, 16)">
        <circle cx="12" cy="12" r="12" fill="url(#purpleGrad)"/>
        <text x="32" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#f8fafc">INDUS <tspan fill="#8b5cf6">CONNECTIONS</tspan></text>
      </g>

      <text x="370" y="32" font-family="'Inter', sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">SOLUTIONS</text>
      <text x="470" y="32" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">CAMPAIGNS</text>
      <text x="560" y="32" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">CREATIVES</text>

      <rect x="635" y="15" width="55" height="26" rx="6" fill="#8b5cf6"/>
      <text x="662" y="32" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">CLIENTS</text>

      <!-- Dashboard Grid -->
      <g transform="translate(40, 75)">
        <!-- Left Stats / Hero Box -->
        <rect width="390" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="25" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#ffffff">Digital Brand &amp; Web Ecosystem</text>
        <text x="25" y="60" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">High performance marketing funnels, dynamic websites &amp; branded media.</text>
        
        <!-- Metrics -->
        <g transform="translate(25, 80)">
          <rect width="100" height="50" rx="6" fill="#0f172a"/>
          <text x="12" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#38bdf8">+145%</text>
          <text x="12" y="40" font-family="'Inter', sans-serif" font-size="9" fill="#64748b">Traffic Growth</text>
        </g>
        <g transform="translate(135, 80)">
          <rect width="100" height="50" rx="6" fill="#0f172a"/>
          <text x="12" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#10b981">99.9%</text>
          <text x="12" y="40" font-family="'Inter', sans-serif" font-size="9" fill="#64748b">Uptime &amp; Speed</text>
        </g>
        <g transform="translate(245, 80)">
          <rect width="100" height="50" rx="6" fill="#0f172a"/>
          <text x="12" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#ec4899">500k+</text>
          <text x="12" y="40" font-family="'Inter', sans-serif" font-size="9" fill="#64748b">Social Reach</text>
        </g>

        <!-- Right Side: Graphic Design & Photography Showcase -->
        <g transform="translate(410, 0)">
          <rect width="230" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <!-- Abstract Creative layout -->
          <rect x="20" y="20" width="85" height="110" rx="6" fill="#6366f1" opacity="0.3"/>
          <circle cx="62" cy="55" r="22" fill="#8b5cf6"/>
          <text x="62" y="95" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">CREATIVE</text>
          
          <rect x="120" y="20" width="90" height="50" rx="6" fill="#0f172a"/>
          <text x="130" y="40" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#38bdf8">Photography</text>
          <text x="130" y="55" font-family="'Inter', sans-serif" font-size="8" fill="#64748b">Product &amp; Portrait</text>

          <rect x="120" y="80" width="90" height="50" rx="6" fill="#0f172a"/>
          <text x="130" y="100" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#ec4899">Brand Ads</text>
          <text x="130" y="115" font-family="'Inter', sans-serif" font-size="8" fill="#64748b">Brochures &amp; Social</text>
        </g>
      </g>

      <!-- Bottom Showcase Cards -->
      <g transform="translate(40, 245)">
        <rect width="640" height="100" rx="8" fill="#182234" stroke="#2a3850" stroke-width="1"/>
        <text x="25" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Key Modules Developed &amp; Administered</text>
        
        <g transform="translate(25, 45)">
          <rect width="180" height="38" rx="6" fill="#0f172a"/>
          <text x="15" y="23" font-family="'Inter', sans-serif" font-size="11" fill="#38bdf8">&#127760; WordPress &amp; CMS Stacks</text>
        </g>
        <g transform="translate(220, 45)">
          <rect width="190" height="38" rx="6" fill="#0f172a"/>
          <text x="15" y="23" font-family="'Inter', sans-serif" font-size="11" fill="#a78bfa">&#128200; Digital Marketing &amp; SEO</text>
        </g>
        <g transform="translate(425, 45)">
          <rect width="190" height="38" rx="6" fill="#0f172a"/>
          <text x="15" y="23" font-family="'Inter', sans-serif" font-size="11" fill="#34d399">&#128247; Commercial Photography</text>
        </g>
      </g>

      <!-- Bottom Bar -->
      <rect y="365" width="720" height="25" fill="#090d16"/>
      <text x="360" y="381" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Led by Mohd Aadil (2022 – Present) &bull; Full Lifecycle Web Development, Digital Strategy &amp; Media Production</text>
    </g>
  </g>
</svg>
